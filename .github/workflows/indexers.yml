name: indexers

on:
  # Automatic schedule disabled for grading. Re-enable later by uncommenting.
  # schedule:
  #   - cron: "0 */2 * * *" # every 2h: index markets + news
  #   - cron: "30 4 * * *" # daily: resolve positions -> precedents
  workflow_dispatch: {} # manual runs only for now

env:
  LLMOD_API_KEY: ${{ secrets.LLMOD_API_KEY }}
  LLMOD_BASE_URL: ${{ secrets.LLMOD_BASE_URL }}
  LLM_MODEL: ${{ secrets.LLM_MODEL }}
  EMBEDDING_MODEL: ${{ secrets.EMBEDDING_MODEL }}
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
  PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
  PINECONE_INDEX: ${{ secrets.PINECONE_INDEX }}
  # optional: switches the RedditIndexer from keyless search to OAuth
  REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
  REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}

jobs:
  index:
    # every-2h schedule + manual runs (not the daily resolve tick)
    if: github.event.schedule != '30 4 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: MarketIndexer
        run: python -m jobs.index_markets --top 500
      - name: NewsIndexer
        run: python -m jobs.index_news --markets 20
      - name: RedditIndexer
        run: python -m jobs.index_social --markets 15
        continue-on-error: true # keyless Reddit rate-limits shared CI IPs

  resolve:
    # daily tick + manual runs
    if: github.event.schedule == '30 4 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: ResolvePositions
        run: python -m jobs.resolve_positions
