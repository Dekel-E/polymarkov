name: autonomy

on:
  # Automatic schedule disabled for grading. Re-enable later by uncommenting.
  # schedule:
  #   - cron: "17 * * * *" # hourly: sentinel notices -> worker investigates/acts
  #   - cron: "0 6 * * *" # daily 06:00 UTC: the agent writes its briefing
  workflow_dispatch: {} # manual runs only for now

env:
  LLMOD_API_KEY: ${{ secrets.LLMOD_API_KEY }}
  LLMOD_BASE_URL: ${{ secrets.LLMOD_BASE_URL }}
  LLM_MODEL: ${{ secrets.LLM_MODEL }}
  EMBEDDING_MODEL: ${{ secrets.EMBEDDING_MODEL }}
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
  PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
  PINECONE_INDEX: ${{ secrets.PINECONE_INDEX }}

jobs:
  watch-and-act:
    if: github.event.schedule != '0 6 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Start automation heartbeat
        run: python -m jobs.heartbeat start
        continue-on-error: true
      - name: Sentinel
        run: python -m jobs.sentinel
      - name: WorkAgenda
        run: python -m jobs.work_agenda
      - name: MarketMaker
        run: python -m jobs.market_maker
      - name: Finish automation heartbeat
        if: always()
        run: python -m jobs.heartbeat finish --status "${{ job.status }}"
        continue-on-error: true

  briefing:
    if: github.event.schedule == '0 6 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Start automation heartbeat
        run: python -m jobs.heartbeat start
        continue-on-error: true
      - name: BuildRelations
        run: python -m jobs.build_relations
      - name: DailyBriefing
        run: python -m jobs.daily_briefing
      - name: Finish automation heartbeat
        if: always()
        run: python -m jobs.heartbeat finish --status "${{ job.status }}"
        continue-on-error: true
